version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - ..:/workspace/sentinel
      # Cache node_modules in a volume to avoid slow host mounting syncs
      - /workspace/sentinel/apps/desktop/frontend/node_modules
    environment:
      - NODE_ENV=development
    restart: always
